# Persona catalog: the specification of expected behaviour, written before the rules.
# Expected outcomes are filled in as each phase defines them. "pending" means the phase that
# decides it has not been built yet. All personas are synthetic.
#
# safety_gate: positive | clear | clear_limited_data | data_unavailable   (Phase 3)
#   The expected gate with the content that is active today. LOINC codes are unverified
#   (follow-up F2), so the PHQ-9 item 9 and C-SSRS checks are not performed and no gate can
#   be plain "clear" yet (owner decision 2026-11-27).
# safety_gate_all_checks_active: the expected gate once every check's content is verified.
#   "clear_limited_data" then means an empty record.
# safety_gate_found: check ids expected to find a signal (positive gates only).
# existing_care: none | excluded_adhd_diagnosis           (Phase 3)
# recommendation: consider_referral_for_formal_screening | no_recommendation |
#   address_safety_gate_first | already_in_care | insufficient_data   (Phase 5, ADHD ruleset 1.0.0)
# signals: ADHD catalog signals expected present as of the catalog date (Phase 5).
# rules_fired: ruleset rules expected to fire (empty when none fires).

as_of = "2026-06-15"

[[personas]]
id = "p01"
title = "Clear ADHD-signal case"
narrative = "Man in his thirties with a stimulant abuse code, an alcohol abuse code, three emergency visits for accidental injuries in two years (one as a car driver in a traffic crash), insomnia and unemployment. PHQ-9 item 9 was 0 in April 2025, outside the safety gate's one-year look-back. No ADHD code."
safety_gate = "clear_limited_data"
safety_gate_all_checks_active = "clear"
existing_care = "none"
recommendation = "consider_referral_for_formal_screening"
notes = "Both rules fire: four high-weight classes and two modifiers."
signals = ["alcohol_involvement", "crash_as_driver", "education_occupation_problems", "insomnia", "repeated_accidental_injury", "stimulant_related_disorder"]
rules_fired = ["high_with_modifiers", "two_high_classes"]

