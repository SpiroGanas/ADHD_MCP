# Persona catalog: the specification of expected behaviour, written before the rules.
# Expected outcomes are filled in as each phase defines them. "pending" means the phase that
# decides it has not been built yet. All personas are synthetic.
#
# safety_gate: positive | clear | clear_limited_data      (Phase 3)
#   The expected gate with the content that is active today. LOINC codes are unverified
#   (follow-up F2), so the PHQ-9 item 9 and C-SSRS checks are not performed and no gate can
#   be plain "clear" yet (owner decision 2026-11-27).
# safety_gate_all_checks_active: the expected gate once every check's content is verified.
#   "clear_limited_data" then means an empty record.
# safety_gate_found: check ids expected to find a signal (positive gates only).
# existing_care: none | excluded_adhd_diagnosis           (Phase 3)
# recommendation: pending until the Phase 5 ruleset       (Phase 5)

as_of = "2026-06-15"

[[personas]]
id = "p01"
title = "Clear ADHD-signal case"
narrative = "Man in his thirties with a stimulant abuse code, an alcohol abuse code, three emergency visits for accidental injuries in two years (one as a car driver in a traffic crash), insomnia and unemployment. PHQ-9 item 9 is 0. No ADHD code."
safety_gate = "clear_limited_data"
safety_gate_all_checks_active = "clear"
existing_care = "none"
recommendation = "pending"
notes = "Expected to trigger a referral suggestion once the Phase 5 ruleset exists."

[[personas]]
id = "p02"
title = "Female presentation with depression and anxiety"
narrative = "Woman in her late twenties with recurrent depression since 2018, generalized anxiety, insomnia, an attention and concentration deficit code, and five different antidepressants over six years. PHQ-9 recorded as a QuestionnaireResponse (item 9 is 0). AUDIT-C 3 (at the female cutoff in the research)."
safety_gate = "clear_limited_data"
safety_gate_all_checks_active = "clear"
existing_care = "none"
recommendation = "pending"
notes = "Tests the questionnaire form of PHQ-9 and the under-flagging risk for women."

[[personas]]
id = "p03"
title = "Safety gate case"
narrative = "Man in his forties discharged from a psychiatric inpatient stay 66 days before the as-of date, admitted for suicidal ideation; PHQ-9 item 9 of 2 and a high C-SSRS risk level in May 2026; a high-risk flag. Also a stimulant dependence code."
safety_gate = "positive"
safety_gate_all_checks_active = "positive"
safety_gate_found = ["suicidal_ideation_code", "psychiatric_discharge", "high_risk_flag"]
safety_gate_found_all_checks_active = ["suicidal_ideation_code", "psychiatric_discharge", "phq9_item9", "cssrs_risk_level", "high_risk_flag"]
existing_care = "none"
recommendation = "address_safety_gate_first"
notes = "The positive gate must come first and withhold any ADHD referral suggestion."

