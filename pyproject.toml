[project]
name = "adhd-mcp"
version = "0.1.0"
description = "MCP server that suggests when a clinician might consider referral for formal adult ADHD screening. Decision support only; never a diagnosis."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp==4.2.6",
    "pydantic==2.14.4",
    "httpx2==2.16.2",
    "pyjwt==2.15.1",
    "cryptography==50.0.2",
]

[project.scripts]
adhd-mcp = "adhd_mcp.server:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "anyio==4.16.0",
    "hypothesis==6.170.17",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "fhir.resources==8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adhd_mcp"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not integration"]
markers = [
    "integration: needs a running local FHIR server (see docs/dev/local_fhir_server.md); run with -m integration",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["adhd_mcp"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT", "DTZ", "T20", "N", "C4", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"scripts/**" = ["T201", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["fhir.resources.*"]
ignore_missing_imports = true
