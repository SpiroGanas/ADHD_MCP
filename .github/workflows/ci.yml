name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Synthetic data guard
        run: uv run python scripts/check_synthetic_data.py
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=xml

  integration:
    name: Integration (local FHIR server)
    runs-on: ubuntu-latest
    services:
      fhir:
        image: hapiproject/hapi:v8.12.0-2
        ports:
          - 8080:8080
        env:
          hapi.fhir.fhir_version: R4
          hapi.fhir.allow_external_references: "true"
          hapi.fhir.client_id_strategy: ANY
          hapi.fhir.server_id_strategy: UUID
          hapi.fhir.default_page_size: "20"
          hapi.fhir.max_page_size: "200"
          spring.datasource.url: "jdbc:h2:mem:hapi"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Integration tests (loads personas, waits for the server)
        run: uv run pytest -m integration
        env:
          ADHD_MCP_TEST_FHIR_URL: http://localhost:8080/fhir

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
