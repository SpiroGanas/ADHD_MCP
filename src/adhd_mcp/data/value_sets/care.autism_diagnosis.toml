id = "care.autism_diagnosis"
version = "0.1.0"
title = "Autism codes (experimental stub)"
description = "Exclusion of the experimental autism stub (Phase 8): an existing autism code means the patient is already in care. Rett's syndrome (F84.2) and childhood disintegrative disorder (F84.3) are not included (owner decision 2026-11-27)."

