id = "injury.motor_vehicle_driver"
version = "0.1.0"
title = "Car or motorcycle driver injured in a transport accident"
description = "Driver is the 4th character: V40-V48 use 0 (nontraffic) and 5 (traffic); V49 and V20-V29 use 0 and 4. '(driver) (passenger)' codes such as V49.3, V49.8, V49.9, V29.3, V29.8 and V29.9 are not counted. V20-V29 include electric (assisted) bicycle drivers (5th character 1; open question). FY2027 addenda not yet checked directly; secondary summaries report no change in scope."

