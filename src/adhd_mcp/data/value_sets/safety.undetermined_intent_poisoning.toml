id = "safety.undetermined_intent_poisoning"
version = "0.1.0"
title = "Poisoning, undetermined intent (T36-T65)"
description = "Safety gate signal (undetermined intent counts). Same character-position rule as intentional self-poisoning; 4 = undetermined."

[[entries]]
system = "http://hl7.org/fhir/sid/icd-10-cm"
match = "regex"
code = "T(?:3[6-9]|[45][0-9]|6[0-5])\\.(?:[0-9A-Z]{2}4[ADS]?|[0-9A-Z]4X[ADS])"
display = "T36-T65 codes whose intent digit is 4"
verified = true
source = "CDC/NCHS ICD-10-CM Tabular List icd10cm-tabular_-2027.xml from ftp.cdc.gov (icd10cm-table-and-index-2027.zip; sha256 d778c97a...4b2a); checked with scripts/verify_icd10cm_value_sets.py. Also passed against the FY2026 April 1 2026 tabular"
source_version = "FY2027 (effective 2026-10-01)"
checked_on = "2026-11-27"
checked_by = "Claude Code agent, delegated by the project owner on 2026-11-26"
