# Clinician-facing wording. Changing any text here is a clinical content change:
# open a clinical content change issue and get the project owner's approval.
version = "0.2.0"

# The standard notice from docs/clinical/intended_use.md. Returned by get_server_info
# and attached to every recommendation.
standard_notice = "This is a suggestion to consider referral for formal screening. It is not a diagnosis. Review the listed evidence and use clinical judgment."

# The approved phrasing for a positive referral suggestion.
approved_recommendation = "Consider referral for formal ADHD screening."

# Attached to every evidence tool output.
evidence_notice = "These are findings from the health record for a clinician to review. They are not a diagnosis and not a risk assessment."

# Returned with a positive safety gate (Phase 3). Directs the clinician to suicide risk
# evaluation and lethal-means counseling; it never states a level of risk.
safety_gate_guidance = "Self-harm signals were found in the record. Before any other screening referral, follow your local suicide risk evaluation process (in VA, the Risk ID pathway: C-SSRS screener and Comprehensive Suicide Risk Evaluation) and offer lethal-means safety counseling. This tool does not assess suicide risk; review the listed evidence."

# The suggested next step with a referral suggestion (research report: ASRS-5 at 14 or more,
# then structured clinician evaluation such as DIVA-5).
adhd_next_step = "Offer an adult ADHD screen (for example the ASRS-5), followed by clinician evaluation if the screen is positive."
safety_next_step = "Follow the safety gate guidance before any screening referral."

# Recommendation texts of assess_referral_need (Phase 5). Drafted 2026-11-27 by the agent for
# owner review; consider_referral reuses the approved phrasing above.
[recommendations]
consider_referral_for_formal_screening = "Consider referral for formal ADHD screening."
no_recommendation = "No referral for formal ADHD screening is suggested from the coded record. Coded data is incomplete, so this does not rule anything out; use clinical judgment."
address_safety_gate_first = "Self-harm signals were found in the record. Follow the safety guidance first; no screening referral is suggested until the signals have been addressed. Other findings are listed for later review."
already_in_care = "An ADHD code, referral, evaluation or care plan is already recorded, so no new referral is suggested."
insufficient_data = "Too little data could be read to make a suggestion. Review the record directly."
# Peer review 01, C3 (drafted 2026-11-28 by the agent for owner review).
outside_intended_population = "This tool is meant for adults alive at the as-of date. This record is outside that population, so no screening referral is suggested. See the notes for the reason."


# Notes added to an assessment.
[notes]
tbi_overlap = "Traumatic brain injury codes are recorded. TBI can produce attention problems that resemble ADHD; if screening is pursued, consider neuropsychological evaluation to tell them apart."
narcolepsy_medication = "Medication ordered for narcolepsy is recorded. It is not counted as an ADHD signal."
exclusions_incomplete = "Not every existing-care check could be completed, so an existing ADHD referral or evaluation may be missed. Check the record before referring."
heuristic = "This suggestion comes from a starting rule taken from published research. The rule has not been clinically validated."
# Why a record is outside the intended population (peer review 01, C3; drafted 2026-11-28 by
# the agent for owner review).
population_under_age = "The patient was under 18 on the as-of date, or the recorded birth date cannot rule that out."
population_no_birth_date = "No birth date is recorded, so the patient's age cannot be checked."
population_deceased = "The patient is recorded as deceased on or before the as-of date."

# Phrasings that state or imply a diagnosis (standing invariant 1) or assess suicide risk
# (the tool surfaces self-harm signals; it never assesses risk). Every tool output is scanned
# for these in tests. Patterns are Python regular expressions, matched case-insensitively;
# "{condition}" is replaced by the alternation of condition names below. Report a recorded
# code as "a <condition> code is recorded", never as "the patient has <condition>".
[diagnostic_language]
conditions = [
    "ADHD",
    "(?-i:ADD)",
    "attention[- ]deficit(?:[/ -]hyperactivity)?(?: disorder)?",
    "autism(?: spectrum disorder)?",
    "PTSD",
    "post-?traumatic stress disorder",
    "bipolar(?: disorder)?",
    "(?:major )?depression",
    "major depressive disorder",
    "generalized anxiety disorder",
    "traumatic brain injury",
    "(?:alcohol|substance) use disorder",
]

[[diagnostic_language.patterns]]
id = "subject-has-condition"
pattern = "\\b(?:has|have|had)\\s+(?:(?:undiagnosed|possible|probable|suspected|likely|presumed|adult|adult-onset)\\s+)*(?:{condition})\\b"

[[diagnostic_language.patterns]]
id = "suffers-from"
pattern = "\\bsuffer(?:s|ing)?\\s+from\\s+(?:adult\\s+)?(?:{condition})\\b"

[[diagnostic_language.patterns]]
id = "consistent-with"
pattern = "\\b(?:consistent\\s+with|indicative\\s+of|diagnostic\\s+of|suggestive\\s+of|suggests?|signs\\s+of|(?:probability|likelihood)\\s+of|meets?\\s+(?:the\\s+)?criteria\\s+for)\\s+(?:adult\\s+)?(?:{condition})\\b"

[[diagnostic_language.patterns]]
id = "likely-condition"
pattern = "\\b(?:likely|probable|probably|presumed|suspected|confirmed|positive\\s+for)\\s+(?:adult\\s+)?(?:{condition})\\b"

[[diagnostic_language.patterns]]
id = "condition-confirmed"
pattern = "\\b(?:{condition})\\s+(?:is\\s+)?(?:confirmed|present|detected|identified|likely|suspected|probable)\\b"

[[diagnostic_language.patterns]]
id = "person-with-condition"
pattern = "\\b(?:patient|veteran|person|individual|adult|man|woman)\\s+with\\s+(?:adult\\s+)?(?:{condition})\\b"

[[diagnostic_language.patterns]]
id = "diagnosis-label"
pattern = "\\bdiagnosis\\s*[:\\-–—]\\s*(?:adult\\s+)?(?:{condition})\\b"

[[diagnostic_language.patterns]]
id = "is-a-diagnosis"
pattern = "\\b(?:is|constitutes|represents)\\s+an?\\s+(?:\\w+\\s+)?diagnosis\\b"

[[diagnostic_language.patterns]]
id = "diagnosed-with"
pattern = "\\b(?:(?:is|are|was|be)\\s+diagnosed\\s+(?:with|as)\\b|diagnosed\\s+(?:with|as)\\s+(?:having\\s+)?(?:adult\\s+)?(?:{condition})\\b)"

[[diagnostic_language.patterns]]
id = "is-suicidal"
pattern = "\\b(?:is|are|appears?|seems?)\\s+(?:actively\\s+|currently\\s+)?suicidal\\b"

[[diagnostic_language.patterns]]
id = "suicide-risk-level"
pattern = "\\b(?:is|are)\\s+at\\s+(?:\\w+\\s+)?risk\\s+(?:of|for)\\s+suicide\\b"
